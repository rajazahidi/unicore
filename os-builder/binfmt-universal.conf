# Kernel binfmt_misc rules for UniCore OS built-in binary dispatch.
# Installed to /etc/binfmt.d/binfmt-universal.conf inside the OS image.
# Without the `P` flag, Linux passes `<pathname> [args...]` directly to uniload-exec.

# Windows PE / Win16 NE / MS-DOS MZ binaries (.exe): match magic bytes "MZ" at offset 0.
:uniload-win32-pe:M::MZ::/usr/libexec/uniload-exec:

# MS-DOS 16-bit .com binaries: match by extension so raw x86_16 COM programs launch via uniload-dos.
:uniload-dos-com:E::com::/usr/libexec/uniload-exec:

# Android packages (.apk): match by extension rather than PK\x03\x04 magic
# so regular .zip/.docx/.jar archives are not intercepted by the ART loader.
:uniload-android-apk:E::apk::/usr/libexec/uniload-exec:

# Windows Installer (.msi): match by extension + internal OLE validation in uniload.
:uniload-win32-msi:E::msi::/usr/libexec/uniload-exec:
