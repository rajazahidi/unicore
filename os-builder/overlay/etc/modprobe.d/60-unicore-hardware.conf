# UniCore OS v1.2.0 Universal Hardware & NVIDIA Stability Defaults
# 1. Enable NVIDIA Open GSP Firmware on Turing/Ampere/Ada/Blackwell GPUs
#    (unlocks hardware reclocking + Mesa 25.1 NVK Vulkan 1.4; safely ignored on older pre-Turing cards).
options nouveau config=NvGspRm=1

# 2. Prevent HDA Intel/Realtek laptop speaker popping & audio sleep stutter.
options snd-hda-intel power_save=0

# 3. Improve Wi-Fi stability on Intel & Realtek (rtw88/rtw89) laptops.
options iwlwifi power_save=0
options rtw88_core disable_lps_deep=y
options rtw89_core disable_ps_mode=y
