name: UniCore CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  rust-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check LF line endings on Linux scripts and configs
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path("os-builder").rglob("*"):
              if not p.is_file():
                  continue
              if p.suffix.lower() in (".png", ".jpg", ".jpeg", ".webp", ".ico", ".exe", ".apk", ".ps1", ".rs", ".toml", ".py", ".der", ".cer", ".efi") or "fixtures/target" in p.as_posix() or "os-builder/keys" in p.as_posix():
                  continue
              if b"\r" in p.read_bytes():
                  bad.append(str(p))
          if bad:
              print("CRLF detected in Linux scripts/configs:", bad)
              sys.exit(1)
          print("All os-builder Linux scripts/configs are clean LF.")
          PY

      - name: Validate shell & Python scripts syntax
        run: |
          bash -n os-builder/build-rootfs.sh
          sh -n os-builder/initramfs-init
          for f in os-builder/overlay/usr/bin/* os-builder/overlay/usr/sbin/* os-builder/overlay/usr/libexec/* os-builder/overlay/etc/local.d/* os-builder/overlay/etc/xdg/labwc/autostart; do
            [ -f "$f" ] || continue
            head -n1 "$f" | grep -q '^#!/bin/sh' && sh -n "$f"
          done
          python3 -m py_compile scripts/test-release-matrix.py scripts/test-ab-install-luks.py scripts/test-aarch64-qemu.py scripts/ota-local-server.py
          python3 scripts/ota-local-server.py --dir docs --self-test

      - name: Install Rust toolchains & musl targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Run clippy with -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit & integration tests
        run: cargo test --workspace

      - name: Build & test ResonanceFX C++17 PipeWire LADSPA plugin
        run: |
          make -C core/resonance-fx test
          make -C core/resonance-fx clean

      - name: Verify cross-architecture musl checks (x86_64 & aarch64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          CC_x86_64_unknown_linux_musl=musl-gcc cargo check --target x86_64-unknown-linux-musl -p uniload -p unicore-aegis-vpn
          cargo check --target aarch64-unknown-linux-musl -p uniload -p aegis-proto
