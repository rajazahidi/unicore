name: UniCore OS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      firmware_profile:
        description: 'Firmware profile (slim or full)'
        required: true
        default: 'slim'

permissions:
  contents: write

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release for tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build-os:
    needs: [ prepare-release ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            shim_dst: shimx64.efi
            mm_dst: mmx64.efi
          - arch: aarch64
            runner: ubuntu-24.04-arm
            shim_dst: shimaa64.efi
            mm_dst: mmaa64.efi
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space for rootfs, SquashFS & ISO build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Rust & musl target (${{ matrix.arch }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - name: Fetch Microsoft-signed upstream UEFI shim & MokManager (${{ matrix.arch }})
        run: |
          set -eu
          mkdir -p /tmp/unicore-shim
          sudo apt-get update -qq
          sudo apt-get install -y -qq shim-signed
          SHIM_SRC="$(find /usr/lib/shim -maxdepth 1 -name "${{ matrix.shim_dst }}.signed*" | sort | tail -n1 || true)"
          if [ -z "${SHIM_SRC}" ]; then
            SHIM_SRC="/usr/lib/shim/${{ matrix.shim_dst }}"
          fi
          cp "${SHIM_SRC}" "/tmp/unicore-shim/${{ matrix.shim_dst }}"
          if [ -f "/usr/lib/shim/${{ matrix.mm_dst }}" ]; then
            cp "/usr/lib/shim/${{ matrix.mm_dst }}" "/tmp/unicore-shim/${{ matrix.mm_dst }}"
          fi
          ls -lh /tmp/unicore-shim/

      - name: Build static uniload & dynamic musl unicore-center (${{ matrix.arch }})
        run: |
          set -eu
          TARGET_ARCH="${{ matrix.arch }}"
          UPPER_ARCH="$(printf '%s' "${TARGET_ARCH}" | tr '[:lower:]' '[:upper:]')"
          SYSROOT="$(rustc --print sysroot)"
          RUST_LLD="$(find "${SYSROOT}/lib/rustlib" -name rust-lld -type f | head -n1)"
          if [ -z "${RUST_LLD}" ]; then
            echo "[ERROR] rust-lld not found inside Rust sysroot ${SYSROOT}" >&2
            exit 1
          fi
          export "CARGO_TARGET_${UPPER_ARCH}_UNKNOWN_LINUX_MUSL_LINKER=${RUST_LLD}"
          export "CARGO_TARGET_${UPPER_ARCH}_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C link-self-contained=yes"

          echo "==> Building static Rust uniload (${TARGET_ARCH}-unknown-linux-musl)"
          cargo build --release --target "${TARGET_ARCH}-unknown-linux-musl" -p uniload

          echo "==> Extracting Alpine 3.20 musl dynamic sysroot (${TARGET_ARCH})"
          MUSL_SYSROOT="/tmp/alpine-musl-sysroot-${TARGET_ARCH}"
          mkdir -p "${MUSL_SYSROOT}"
          docker run --rm \
            -v "${MUSL_SYSROOT}:/out" \
            alpine:3.20 /bin/sh -c "
              set -eu
              apk add --no-cache musl-dev libgcc
              cp -L /lib/ld-musl-${TARGET_ARCH}.so.1 /out/ld-musl-${TARGET_ARCH}.so.1
              cp -L /lib/ld-musl-${TARGET_ARCH}.so.1 /out/libc.so
              cp -L /usr/lib/Scrt1.o /usr/lib/crti.o /usr/lib/crtn.o /usr/lib/libdl.a /out/
              cp -L /usr/lib/libgcc_s.so.1 /out/libgcc_s.so.1
              cp -L /usr/lib/libgcc_s.so.1 /out/libgcc_s.so
            "

          echo "==> Building unicore-center (dynamic musl for Alpine 3.20 ${TARGET_ARCH})"
          cargo rustc -p unicore-center --bin unicore-center --release \
            --target "${TARGET_ARCH}-unknown-linux-musl" -- \
            -C target-feature=-crt-static \
            -L "native=${MUSL_SYSROOT}" \
            -C "link-arg=--dynamic-linker=/lib/ld-musl-${TARGET_ARCH}.so.1"

          mkdir -p os-builder/out/ci-bins
          cp "target/${TARGET_ARCH}-unknown-linux-musl/release/unicore-center" os-builder/out/ci-bins/unicore-center

          echo "==> Smoke-testing unicore-center dynamic linking inside native Alpine 3.20 (${TARGET_ARCH})"
          docker run --rm \
            -v "${PWD}/os-builder/out/ci-bins:/bins:ro" \
            alpine:3.20 /bin/sh -c "
              set -eu
              apk add --no-cache libgcc fontconfig freetype libxkbcommon wayland-libs-client
              ldd /bins/unicore-center
              /bins/unicore-center --check
            "

      - name: Fetch offline Win32/Win16 gaming runtimes (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p /tmp/win32-assets
          curl -fsSL -o /tmp/win32-assets/dxvk-2.4.1.tar.gz https://github.com/doitsujin/dxvk/releases/download/v2.4.1/dxvk-2.4.1.tar.gz
          curl -fsSL -o /tmp/win32-assets/vkd3d-proton-2.13.tar.zst https://github.com/HansKristian-Work/vkd3d-proton/releases/download/v2.13/vkd3d-proton-2.13.tar.zst
          curl -fsSL -o /tmp/win32-assets/cnc-ddraw-v7.1.0.0.zip https://github.com/FunkyFr3sh/cnc-ddraw/releases/download/v7.1.0.0/cnc-ddraw.zip
          curl -fsSL -o /tmp/win32-assets/otvdm-v0.9.0.zip https://github.com/otya128/winevdm/releases/download/v0.9.0/otvdm-v0.9.0.zip
          curl -fsSL -o /tmp/win32-assets/winetricks https://raw.githubusercontent.com/Winetricks/winetricks/master/src/winetricks

      - name: Build isolated ARM64 Box64 + Wine x64 WoW64 glibc runtime (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          set -eu
          mkdir -p /tmp/win32-assets /tmp/arm64-rt /tmp/arm64-stage
          curl -fsSL -o /tmp/win32-assets/winetricks https://raw.githubusercontent.com/Winetricks/winetricks/master/src/winetricks

          echo "==> Stage 1: Building Box64 v0.4.4, x64lib, and Kron4ek Wine 11.22 WoW64 (ubuntu:24.04)"
          docker run --rm \
            -v "/tmp/arm64-stage:/stage" \
            -v "${PWD}/os-builder/arm64-run-wine-box64.sh:/tmp/run-wine-box64.sh:ro" \
            ubuntu:24.04 /bin/bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                ca-certificates curl xz-utils tar cmake make gcc g++ python3 binutils

              mkdir -p /tmp/box64-src /stage/bin /stage/opt/wine \
                /stage/sysroot/lib /stage/sysroot/lib/aarch64-linux-gnu \
                /stage/sysroot/usr/lib/x86_64-linux-gnu /stage/sysroot/usr/lib/i386-linux-gnu

              echo "==> Compiling Box64 v0.4.4 (ARM64 Dynarec, isolated glibc PT_INTERP + DT_RPATH)"
              curl -fsSL https://github.com/ptitSeb/box64/archive/refs/tags/v0.4.4.tar.gz | tar -xz -C /tmp/box64-src --strip-components=1
              LINK_FLAGS="-Wl,--dynamic-linker=/usr/share/unicore/arm64-win32/sysroot/lib/ld-linux-aarch64.so.1 -Wl,-rpath,/usr/share/unicore/arm64-win32/sysroot/lib/aarch64-linux-gnu -Wl,--disable-new-dtags"
              LDFLAGS="${LINK_FLAGS}" cmake -S /tmp/box64-src -B /tmp/box64-src/build \
                -DARM_DYNAREC=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="${LINK_FLAGS}"
              cmake --build /tmp/box64-src/build -j"$(nproc)"
              cp /tmp/box64-src/build/box64 /stage/bin/box64
              readelf -l /stage/bin/box64 | grep -E "INTERP|interpreter" || true
              readelf -d /stage/bin/box64 | grep -E "RPATH|RUNPATH" || true

              echo "==> Copying Box64 x64lib/x86lib (libgcc_s, libstdc++, libunwind, etc.)"
              cp -a /tmp/box64-src/x64lib/. /stage/sysroot/usr/lib/x86_64-linux-gnu/
              if [ -d /tmp/box64-src/x86lib ]; then
                cp -a /tmp/box64-src/x86lib/. /stage/sysroot/usr/lib/i386-linux-gnu/
              fi
              ls -la /stage/sysroot/usr/lib/x86_64-linux-gnu/

              echo "==> Fetching Kron4ek Wine 11.22 WoW64 (amd64+x86 Windows support)"
              curl -fsSL -o /tmp/wine.tar.xz https://github.com/Kron4ek/Wine-Builds/releases/download/11.22/wine-11.22-amd64-wow64.tar.xz
              tar -xJf /tmp/wine.tar.xz -C /stage/opt/wine --strip-components=1
              readelf -d /stage/opt/wine/lib/wine/x86_64-unix/ntdll.so | grep NEEDED || true

              install -m 0755 /tmp/run-wine-box64.sh /stage/run-wine-box64.sh
            '

          echo "==> Stage 2: Packaging lean ARM64 glibc 2.39 runtime libraries (no compiler bloat)"
          docker run --rm \
            -v "/tmp/arm64-stage:/stage" \
            -v "/tmp/arm64-rt:/out" \
            ubuntu:24.04 /bin/bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              EXTRA_PKGS=""
              for pair in "libasound2t64:libasound2" "libgnutls30t64:libgnutls30" "libcups2t64:libcups2"; do
                p1="${pair%%:*}"
                p2="${pair#*:}"
                if apt-cache show "${p1}" >/dev/null 2>&1; then
                  EXTRA_PKGS="${EXTRA_PKGS} ${p1}"
                else
                  EXTRA_PKGS="${EXTRA_PKGS} ${p2}"
                fi
              done
              apt-get install -y -qq --no-install-recommends \
                tar zstd libunwind8 libfreetype6 libfontconfig1 libx11-6 libxext6 libxrender1 \
                libxrandr2 libxfixes3 libxcursor1 libxi6 libxcomposite1 libwayland-client0 \
                libwayland-egl1 libwayland-cursor0 libxkbcommon0 libpulse0 libvulkan1 \
                libegl1 libgl1 libglx0 libkrb5-3 libdbus-1-3 libudev1 ${EXTRA_PKGS}

              cp -L /lib/ld-linux-aarch64.so.1 /stage/sysroot/lib/ld-linux-aarch64.so.1
              cp -a /usr/lib/aarch64-linux-gnu/*.so* /stage/sysroot/lib/aarch64-linux-gnu/ 2>/dev/null || true
              cp -a /usr/lib/aarch64-linux-gnu/pulseaudio/*.so* /stage/sysroot/lib/aarch64-linux-gnu/ 2>/dev/null || true

              echo "==> Packing /out/arm64-win32-runtime.tar.zst"
              tar --zstd -cf /out/arm64-win32-runtime.tar.zst -C /stage .
              ls -lh /out/arm64-win32-runtime.tar.zst
            '
          sudo rm -rf /tmp/arm64-stage

          echo "==> Smoke-testing isolated Box64 + Wine WoW64 inside Alpine 3.20 musl (aarch64)"
          docker run --rm \
            -v "/tmp/arm64-rt:/rt:ro" \
            alpine:3.20 /bin/sh -c '
              set -eu
              apk add --no-cache tar zstd
              mkdir -p /usr/share/unicore/arm64-win32
              tar --zstd -xf /rt/arm64-win32-runtime.tar.zst -C /usr/share/unicore/arm64-win32
              echo "==> Verifying Box64 direct execution inside Alpine 3.20 musl"
              /usr/share/unicore/arm64-win32/bin/box64 --version
              if ! /usr/share/unicore/arm64-win32/run-wine-box64.sh --version; then
                echo "=== wine --version failed; retrying with BOX64_LOG=1 ==="
                BOX64_LOG=1 /usr/share/unicore/arm64-win32/run-wine-box64.sh --version || true
                exit 1
              fi
              echo "==> Verifying real Win32 PE command execution (cmd.exe) via Box64 + Wine WoW64"
              OUT="$(WINEDEBUG=-all WINEDLLOVERRIDES="mscoree,mshtml=" WINEPREFIX=/tmp/test-pfx /usr/share/unicore/arm64-win32/run-wine-box64.sh cmd /c "echo UNICORE_ARM64_WIN32_OK" 2>&1 || true)"
              printf "%s\n" "${OUT}"
              if ! printf "%s\n" "${OUT}" | grep -q "UNICORE_ARM64_WIN32_OK"; then
                echo "=== cmd.exe failed; retrying with BOX64_LOG=1 ==="
                BOX64_LOG=1 WINEDLLOVERRIDES="mscoree,mshtml=" WINEPREFIX=/tmp/test-pfx /usr/share/unicore/arm64-win32/run-wine-box64.sh cmd /c "echo UNICORE_ARM64_WIN32_OK" || true
                exit 1
              fi
            '

      - name: Build UniCore OS image, Secure Boot MOK signing & signed OTA manifest (${{ matrix.arch }})
        env:
          UNICORE_RELEASE_KEY: ${{ secrets.UNICORE_RELEASE_KEY }}
          UNICORE_RELEASE_PUB: ${{ secrets.UNICORE_RELEASE_PUB }}
          UNICORE_MOK_KEY: ${{ secrets.UNICORE_MOK_KEY }}
          UNICORE_MOK_CERT: ${{ secrets.UNICORE_MOK_CERT }}
        run: |
          set -eu
          TARGET_ARCH="${{ matrix.arch }}"
          mkdir -p /tmp/unicore-keys /tmp/win32-assets /tmp/arm64-rt os-builder/out
          EXTRA_ENV=""
          if [ -n "${UNICORE_RELEASE_PUB}" ]; then
            printf '%s\n' "${UNICORE_RELEASE_PUB}" | tr -d '\r' > /tmp/unicore-keys/update.pub
            EXTRA_ENV="${EXTRA_ENV} -e UPDATE_PUBKEY_OVERRIDE=/work/keys/update.pub"
          fi
          if [ -n "${UNICORE_RELEASE_KEY}" ]; then
            printf '%s\n' "${UNICORE_RELEASE_KEY}" | tr -d '\r' > /tmp/unicore-keys/release.key
            chmod 600 /tmp/unicore-keys/release.key
            EXTRA_ENV="${EXTRA_ENV} -e UPDATE_SIGN_KEY_OVERRIDE=/work/keys/release.key"
          fi
          if [ -n "${UNICORE_MOK_KEY}" ] && [ -n "${UNICORE_MOK_CERT}" ]; then
            printf '%s\n' "${UNICORE_MOK_KEY}" | tr -d '\r' > /tmp/unicore-keys/mok.key
            chmod 600 /tmp/unicore-keys/mok.key
            printf '%s\n' "${UNICORE_MOK_CERT}" | tr -d '\r' > /tmp/unicore-keys/mok.crt
            EXTRA_ENV="${EXTRA_ENV} -e MOK_KEY_OVERRIDE=/work/keys/mok.key -e MOK_CERT_OVERRIDE=/work/keys/mok.crt"
          fi
          if [ "${TARGET_ARCH}" = "x86_64" ]; then
            EXTRA_ENV="${EXTRA_ENV} -e DXVK_ARCHIVE_OVERRIDE=/work/win32-assets/dxvk-2.4.1.tar.gz -e VKD3D_ARCHIVE_OVERRIDE=/work/win32-assets/vkd3d-proton-2.13.tar.zst -e CNCDDRAW_ARCHIVE_OVERRIDE=/work/win32-assets/cnc-ddraw-v7.1.0.0.zip -e OTVDM_ARCHIVE_OVERRIDE=/work/win32-assets/otvdm-v0.9.0.zip"
          elif [ -f /tmp/arm64-rt/arm64-win32-runtime.tar.zst ]; then
            EXTRA_ENV="${EXTRA_ENV} -e ARM64_WIN32_RUNTIME_OVERRIDE=/work/arm64-rt/arm64-win32-runtime.tar.zst"
          fi
          GRUB_PKGS="grub grub-efi"
          if [ "${TARGET_ARCH}" = "x86_64" ]; then
            GRUB_PKGS="${GRUB_PKGS} grub-bios"
          fi

          docker run --rm --privileged \
            -v "${PWD}:/work" \
            -v "/tmp/unicore-keys:/work/keys" \
            -v "/tmp/unicore-shim:/work/shim:ro" \
            -v "/tmp/win32-assets:/work/win32-assets:ro" \
            -v "/tmp/arm64-rt:/work/arm64-rt:ro" \
            -e "TARGET_ARCH=${TARGET_ARCH}" \
            -e "FIRMWARE_PROFILE_OVERRIDE=${{ github.event.inputs.firmware_profile || 'slim' }}" \
            -e "UNILOAD_BIN_OVERRIDE=/work/target/${TARGET_ARCH}-unknown-linux-musl/release/uniload" \
            -e "UNICORE_CENTER_BIN_OVERRIDE=/work/os-builder/out/ci-bins/unicore-center" \
            -e "WINETRICKS_SCRIPT_OVERRIDE=/work/win32-assets/winetricks" \
            -e "SHIM_DIR_OVERRIDE=/work/shim" \
            ${EXTRA_ENV} \
            alpine:3.20 /bin/sh -c "
              set -eu
              apk add --no-cache bash squashfs-tools tar zstd unzip gzip findutils kmod e2fsprogs util-linux ${GRUB_PKGS} xorriso mtools dosfstools openssl sbsigntool
              bash /work/os-builder/build-rootfs.sh
              if [ -f /work/keys/update.pub ] && [ -f /work/os-builder/out/unicore-manifest-${TARGET_ARCH}.json.sig ]; then
                echo '==> Strictly verifying Ed25519 OTA manifest signature (${TARGET_ARCH})'
                /work/target/${TARGET_ARCH}-unknown-linux-musl/release/uniload update verify-manifest \
                  /work/os-builder/out/unicore-manifest-${TARGET_ARCH}.json \
                  --arch ${TARGET_ARCH} \
                  --pubkey /work/keys/update.pub \
                  --sig /work/os-builder/out/unicore-manifest-${TARGET_ARCH}.json.sig \
                  --require-signature
              fi
              if [ -f /work/keys/mok.crt ]; then
                echo '==> Strictly verifying UEFI Secure Boot MOK signature on vmlinuz-${TARGET_ARCH}'
                sbverify --cert /work/keys/mok.crt /work/os-builder/out/vmlinuz-${TARGET_ARCH}
              fi
              rm -rf /work/os-builder/out/work
            "
          rm -rf /tmp/unicore-keys
          ls -lh os-builder/out/

      - name: Publish x86_64 Signed OTA & Catalog Release Assets
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'x86_64'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os-builder/out/vmlinuz-x86_64
            os-builder/out/initramfs-x86_64.img
            os-builder/out/unicore-rootfs-x86_64.squashfs
            os-builder/out/unicore-os-x86_64.iso
            os-builder/out/unicore-os-x86_64.iso.sha256
            os-builder/out/unicore-manifest-x86_64.json
            os-builder/out/unicore-manifest-x86_64.json.sig
            os-builder/out/unicore-manifest.json
            os-builder/out/unicore-manifest.json.sig
            os-builder/out/unicore-catalog.json
            os-builder/out/unicore-catalog.json.sig

      - name: Publish aarch64 Signed OTA Release Assets
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'aarch64'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os-builder/out/vmlinuz-aarch64
            os-builder/out/initramfs-aarch64.img
            os-builder/out/unicore-rootfs-aarch64.squashfs
            os-builder/out/unicore-os-aarch64.iso
            os-builder/out/unicore-os-aarch64.iso.sha256
            os-builder/out/unicore-manifest-aarch64.json
            os-builder/out/unicore-manifest-aarch64.json.sig

      - name: Upload Manifest & Checksum Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: unicore-manifest-${{ matrix.arch }}
          retention-days: 7
          path: |
            os-builder/out/unicore-os-${{ matrix.arch }}.iso.sha256
            os-builder/out/unicore-manifest-${{ matrix.arch }}.json
            os-builder/out/unicore-manifest-${{ matrix.arch }}.json.sig
