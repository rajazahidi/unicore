[package]
name = "aegis-proto"
version = "0.2.0"
edition = "2021"
description = "Shared Anti-DPI, Zero-Domain REALITY TLS 1.3, and Hybrid X25519 + ML-KEM-768 protocol crate for AegisTunnel"

[dependencies]
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
hmac = "0.12.1"
ml-kem = { version = "0.3.4", features = ["getrandom"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.8"
subtle = "2.6"
tokio = { version = "1.43", features = ["io-util"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
