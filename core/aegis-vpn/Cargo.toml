[package]
name = "unicore-aegis-vpn"
version = "1.6.0"
edition = "2021"
description = "UniCore OS native AegisTunnel VPN daemon & CLI (WireGuard + AmneziaWG Anti-DPI + REALITY TCP/443 + Hybrid Post-Quantum ML-KEM-768 + Local DNS Sinkhole)"

[lib]
name = "unicore_aegis_vpn"
path = "src/lib.rs"

[[bin]]
name = "unicore-aegis-vpn"
path = "src/main.rs"

[dependencies]
aegis-proto = { path = "../aegis-proto" }
boringtun = "0.7.1"
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
socket2 = "0.5.8"
rand = "0.8.5"
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
libc = "0.2"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
